<!doctype html>
<html lang="zh-CN" data-output-profile="{{OUTPUT_PROFILE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root {
      --paper-0: #f8f2e7;
      --paper-1: #efe4d2;
      --paper-2: #dfcfb8;
      --ink-0: #2d2722;
      --ink-1: #514840;
      --ink-2: #786d62;
      --cinnabar: #9d382e;
      --cinnabar-deep: #70251f;
      --cinnabar-soft: #ecd8cf;
      --moss: #4f684b;
      --warning: #8a4b26;
      --font-display: "Kaiti SC", "STKaiti", "FZKai-Z03", serif;
      --font-reading: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif;
      --font-ui: "Hiragino Sans GB", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-code: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --content: 92rem;
      --reading: clamp(48rem, 78vw, 76rem);
      --line: 1px solid rgba(120, 109, 98, .32);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--paper-1); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink-0);
      background:
        radial-gradient(circle at 18% 8%, rgba(255,255,255,.7), transparent 32rem),
        repeating-linear-gradient(7deg, transparent 0 24px, rgba(84,67,50,.025) 25px, transparent 26px 53px),
        var(--paper-0);
      font-family: var(--font-reading);
      line-height: 1.95;
    }

    a { color: var(--cinnabar-deep); text-underline-offset: .18em; }
    img { max-width: 100%; height: auto; }
    p, li, td, th, figcaption { overflow-wrap: anywhere; }
    .layout { min-height: 100vh; }
    .skip-link {
      position: fixed;
      z-index: 30;
      top: .75rem;
      left: 50%;
      padding: .55rem .85rem;
      color: var(--paper-0);
      background: var(--ink-0);
      font-family: var(--font-ui);
      text-decoration: none;
      transform: translate(-50%, -180%);
      transition: transform 140ms ease-out;
    }
    .skip-link:focus { transform: translate(-50%, 0); }

    .rail {
      position: fixed;
      z-index: 20;
      top: max(1rem, env(safe-area-inset-top));
      left: max(1rem, env(safe-area-inset-left));
    }
    .nav-shell { position: relative; }
    .nav-trigger {
      width: 3rem;
      height: 3rem;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 0;
      color: var(--paper-0);
      background: var(--ink-0);
      box-shadow: 0 .6rem 1.6rem rgba(45,39,34,.16);
      cursor: pointer;
      transition: transform 160ms ease-out, background-color 160ms ease-out;
    }
    .nav-trigger:hover { background: var(--cinnabar-deep); transform: translateY(-1px); }
    .nav-trigger:active { transform: translateY(1px); }
    .nav-trigger:focus-visible {
      outline: 3px solid var(--cinnabar);
      outline-offset: 3px;
    }
    .nav-trigger svg { width: 1.35rem; height: 1.35rem; stroke: currentColor; }
    .nav-panel {
      position: absolute;
      top: 3.55rem;
      left: 0;
      width: min(22rem, calc(100vw - 2rem - env(safe-area-inset-left) - env(safe-area-inset-right)));
      max-height: calc(100vh - 5.5rem - env(safe-area-inset-top));
      max-height: calc(100dvh - 5.5rem - env(safe-area-inset-top));
      padding: 1.6rem;
      overflow-y: auto;
      overscroll-behavior: contain;
      color: var(--paper-0);
      background: var(--ink-0);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 1.1rem 2.8rem rgba(45,39,34,.24);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-.45rem);
      transform-origin: top left;
      transition: opacity 160ms ease-out, transform 160ms ease-out, visibility 160ms;
    }
    .nav-shell.is-open .nav-panel {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }
    .kicker {
      margin: 0 0 .7rem;
      color: var(--cinnabar-soft);
      font-family: var(--font-ui);
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .rail-title {
      max-width: 12ch;
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2rem, 8vw, 2.8rem);
      font-weight: 600;
      line-height: 1.18;
      letter-spacing: .04em;
    }
    .rail-subtitle {
      max-width: 26rem;
      margin: 1rem 0 0;
      color: var(--paper-2);
      font-size: .94rem;
      line-height: 1.75;
    }
    .meta { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: 1.4rem; }
    .meta span {
      display: block;
      padding: .18rem .5rem;
      border: 1px solid rgba(255,255,255,.2);
      color: var(--paper-1);
      font-family: var(--font-ui);
      font-size: .72rem;
    }
    .toc {
      display: grid;
      gap: .4rem;
      margin-top: 1.7rem;
    }
    .toc a {
      width: 100%;
      min-height: 2.75rem;
      display: flex;
      align-items: center;
      gap: .55rem;
      padding: .35rem .65rem;
      border: 1px solid rgba(255,255,255,.16);
      color: var(--paper-1);
      font-family: var(--font-ui);
      font-size: .82rem;
      line-height: 1.25;
      text-decoration: none;
    }
    .toc a:hover { border-color: rgba(236,216,207,.58); background: rgba(255,255,255,.06); }
    .toc a:focus-visible { outline: 2px solid var(--cinnabar-soft); outline-offset: 2px; }
    .toc-number { color: var(--cinnabar-soft); font-variant-numeric: tabular-nums; }
    @media screen {
      html[data-output-profile="document"] .nav-panel {
        background: rgba(45,39,34,.60);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }
      html[data-output-profile="document"] .nav-overview { display: none; }
      html[data-output-profile="document"] .toc { margin-top: 0; }
    }

    .document {
      width: min(100%, var(--content));
      margin: 0 auto;
      padding-top: clamp(5.5rem, 12vw, 8rem);
      padding-right: max(clamp(1rem, 5vw, 4.5rem), env(safe-area-inset-right));
      padding-bottom: max(6rem, env(safe-area-inset-bottom));
      padding-left: max(clamp(1rem, 5vw, 4.5rem), env(safe-area-inset-left));
    }
    .hero {
      max-width: var(--reading);
      padding-bottom: 2.5rem;
      border-bottom: var(--line);
    }
    .hero-kicker {
      margin: 0 0 .7rem;
      color: var(--cinnabar);
      font-family: var(--font-ui);
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .18em;
    }
    .hero h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2.7rem, 8vw, 5.2rem);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: .025em;
    }
    .hero-subtitle {
      margin: 1.25rem 0 0;
      color: var(--ink-1);
      font-size: clamp(1.05rem, 2.4vw, 1.28rem);
      line-height: 1.8;
    }
    .rail-subtitle:empty, .hero-subtitle:empty { display: none; }
    .lead {
      max-width: var(--reading);
      margin: 2.5rem 0 0;
      padding-left: 1.25rem;
      border-left: .22rem solid var(--cinnabar);
      color: var(--ink-1);
      font-size: 1.1rem;
      line-height: 1.9;
    }

    .section { margin-top: clamp(4rem, 9vw, 7rem); scroll-margin-top: 2rem; }
    .section-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: end;
      gap: 1rem;
      max-width: var(--reading);
      padding-bottom: 1rem;
      border-bottom: .18rem double var(--ink-1);
    }
    .section-number {
      color: var(--cinnabar);
      font-family: var(--font-reading);
      font-size: 2.7rem;
      font-weight: 600;
      line-height: .8;
      font-variant-numeric: tabular-nums;
    }
    .section-eyebrow {
      margin: 0 0 .25rem;
      color: var(--ink-2);
      font-family: var(--font-ui);
      font-size: .7rem;
      letter-spacing: .16em;
    }
    .section h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.9rem, 5vw, 3rem);
      font-weight: 600;
      line-height: 1.2;
    }
    .blocks { max-width: var(--reading); margin-top: 2rem; }
    .blocks p { margin: 0 0 1.25rem; font-size: 1.04rem; }
    .blocks ul, .blocks ol { margin: 0 0 1.5rem; padding-left: 1.6rem; }
    .blocks li { margin: .45rem 0; padding-left: .25rem; }
    .blocks li::marker { color: var(--cinnabar); }
    .divider { width: 4.5rem; margin: 2.5rem 0; border: 0; border-top: 2px solid var(--cinnabar); }
    blockquote {
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: 2rem 0;
      padding: 1rem 1.2rem 1rem 1.4rem;
      border-left: .25rem solid var(--cinnabar);
      background: rgba(239,228,210,.62);
      color: var(--ink-1);
      font-size: .9rem;
      line-height: 1.8;
    }
    .blocks blockquote p { margin: 0; font-size: inherit; }
    blockquote cite { display: block; margin-top: .7rem; color: var(--ink-2); font-family: var(--font-ui); font-size: .78rem; font-style: normal; }
    .callout {
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: 2rem 0;
      padding: 1rem 1.2rem;
      border-left: .28rem solid var(--cinnabar);
      background: rgba(236,216,207,.55);
      font-size: .9rem;
      line-height: 1.8;
    }
    .callout.warning { border-color: var(--warning); background: rgba(234,217,192,.62); }
    .callout.success { border-color: var(--moss); background: rgba(215,225,207,.58); }
    .callout-title { margin: 0 0 .35rem; font-family: var(--font-ui); font-size: .78rem; font-weight: 700; letter-spacing: .08em; }
    .blocks .callout p { margin: 0; font-size: inherit; }
    .table-wrap { max-width: 100%; margin: 2rem 0; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .94rem; }
    th, td { padding: .75rem .8rem; border-bottom: var(--line); text-align: left; vertical-align: top; }
    th { background: rgba(239,228,210,.75); color: var(--ink-1); font-family: var(--font-ui); font-size: .78rem; letter-spacing: .04em; }
    .code-block {
      margin: 2rem 0;
      overflow: hidden;
      border: 0;
      border-radius: .45rem;
      background: rgba(234,234,230,.90);
    }
    .code-toolbar {
      min-height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .4rem .55rem .4rem 1rem;
      border-bottom: 1px solid rgba(72,75,77,.24);
      background: transparent;
      font-family: var(--font-ui);
    }
    .code-language {
      background: none;
      color: var(--cinnabar-deep);
      font-family: var(--font-code);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .code-copy {
      min-width: 3.5rem;
      min-height: 2rem;
      padding: .2rem .6rem;
      border: 1px solid rgba(72,75,77,.30);
      color: var(--ink-1);
      background: rgba(241,241,238,.66);
      font-family: var(--font-ui);
      font-size: .72rem;
      cursor: pointer;
    }
    .code-copy:hover { border-color: var(--cinnabar); color: var(--cinnabar-deep); background: rgba(248,248,245,.94); }
    .code-copy:focus-visible { outline: 2px solid var(--cinnabar); outline-offset: 2px; }
    pre {
      margin: 0;
      padding: 1.1rem 1.2rem;
      overflow-x: auto;
      background: rgba(234,234,230,.90);
      color: #25282a;
      font-family: var(--font-code);
      font-size: .88rem;
      line-height: 1.65;
    }
    code { font-family: var(--font-code); }
    :not(pre) > code { padding: .08em .3em; background: var(--paper-1); color: var(--cinnabar-deep); font-size: .88em; }
    figure { margin: 2rem 0; }
    figcaption { margin-top: .65rem; color: var(--ink-2); font-family: var(--font-ui); font-size: .8rem; }
    .footer { max-width: var(--reading); margin-top: 6rem; padding-top: 1.2rem; border-top: var(--line); color: var(--ink-2); font-family: var(--font-ui); font-size: .78rem; }

    @media (hover: hover) {
      .nav-shell:not(.is-hover-suppressed):hover .nav-panel {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
      }
    }

    @media (max-width: 36rem) {
      .hero h1 { font-size: clamp(2.35rem, 12vw, 3.5rem); }
      .section-head { gap: .7rem; }
      .section-number { font-size: 2.15rem; }
      .section h2 { font-size: clamp(1.75rem, 9vw, 2.35rem); }
      .blocks { margin-top: 1.5rem; }
      blockquote, .callout, .code-block { margin: 1.5rem 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .skip-link, .nav-trigger, .nav-panel { transition: none; }
    }

    html[data-output-profile="image"] { background: var(--ink-0); scrollbar-width: none; }
    html[data-output-profile="image"]::-webkit-scrollbar,
    html[data-output-profile="image"] body::-webkit-scrollbar { display: none; }
    html[data-output-profile="image"] body {
      min-width: 44rem;
      background:
        radial-gradient(circle at 82% 8%, rgba(157,56,46,.17), transparent 30rem),
        repeating-linear-gradient(7deg, transparent 0 24px, rgba(84,67,50,.025) 25px, transparent 26px 53px),
        var(--paper-0);
    }
    html[data-output-profile="image"] .skip-link { display: none; }
    html[data-output-profile="image"] .layout {
      display: block;
      min-height: 100vh;
      border: 1.15rem solid var(--ink-0);
    }
    html[data-output-profile="image"] .rail {
      position: static;
      padding: 0;
      border: 0;
      border-bottom: .42rem solid var(--cinnabar);
    }
    html[data-output-profile="image"] .nav-shell { position: static; }
    html[data-output-profile="image"] .nav-trigger { display: none; }
    html[data-output-profile="image"] .nav-panel {
      position: static;
      width: auto;
      max-height: none;
      padding: 3rem 3.5rem 2.5rem;
      overflow: visible;
      border: 0;
      box-shadow: none;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: none;
    }
    html[data-output-profile="image"] .rail-title {
      max-width: none;
      font-size: clamp(3rem, 4.1vw, 4.4rem);
      line-height: 1.1;
      letter-spacing: .02em;
    }
    html[data-output-profile="image"] .rail-subtitle {
      max-width: none;
      font-size: 1.1rem;
    }
    html[data-output-profile="image"] .toc,
    html[data-output-profile="image"] .hero { display: none; }
    html[data-output-profile="image"] .code-copy { display: none; }
    html[data-output-profile="image"] .document {
      width: 100%;
      padding: 2.75rem 3.5rem 3.5rem;
    }
    html[data-output-profile="image"] .lead {
      margin-top: 0;
      max-width: none;
      font-size: 1.18rem;
    }
    html[data-output-profile="image"] .section { margin-top: 2.6rem; }
    html[data-output-profile="image"] .section-head,
    html[data-output-profile="image"] .blocks,
    html[data-output-profile="image"] .footer { max-width: none; }
    html[data-output-profile="image"] .section h2 { font-size: clamp(2rem, 3vw, 3rem); }
    html[data-output-profile="image"] .blocks { margin-top: 1.5rem; }
    html[data-output-profile="image"] .blocks p,
    html[data-output-profile="image"] .blocks li { font-size: 1.05rem; }
    html[data-output-profile="image"] .blocks blockquote,
    html[data-output-profile="image"] .blocks .callout { font-size: .94rem; }
    html[data-output-profile="image"] .blocks blockquote p,
    html[data-output-profile="image"] .blocks .callout p { font-size: inherit; }
    html[data-output-profile="image"] blockquote,
    html[data-output-profile="image"] .callout,
    html[data-output-profile="image"] .table-wrap,
    html[data-output-profile="image"] .code-block,
    html[data-output-profile="image"] figure { margin-top: 1.5rem; margin-bottom: 1.5rem; }
    html[data-output-profile="image"] .footer { margin-top: 2.5rem; }

    @media print {
      @page {
        size: A4 portrait;
        margin: 18mm 17mm 20mm;
        @bottom-center {
          content: counter(page) " / " counter(pages);
          color: #786d62;
          font-family: "Hiragino Sans GB", "PingFang SC", "Microsoft YaHei", sans-serif;
          font-size: 8pt;
          font-variant-numeric: tabular-nums;
        }
      }
      html, body { background: white; }
      body {
        color: #211d19;
        font-size: 10.5pt;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .skip-link { display: none; }
      .layout { display: block; }
      .rail { position: static; padding: 0 0 10mm; color: #211d19; background: white; border-bottom: 1px solid #a99a88; }
      .nav-shell { position: static; }
      .nav-trigger { display: none; }
      .nav-panel { position: static; width: auto; max-height: none; padding: 0; overflow: visible; color: #211d19; background: white; border: 0; box-shadow: none; opacity: 1; visibility: visible; pointer-events: auto; transform: none; }
      .rail-title { max-width: none; font-size: 33pt; line-height: 1.16; letter-spacing: 0; }
      .rail-subtitle, .meta span { color: #514840; }
      .meta span { border-color: #cfc1ad; }
      .toc { display: none; }
      .document { width: 100%; padding: 0; }
      .hero { display: none; }
      .section { break-inside: auto; margin-top: 9mm; }
      blockquote, .callout, .table-wrap, .code-block, figure { margin-top: 5mm; margin-bottom: 5mm; }
      .section-head, blockquote, .callout, table, .code-block, pre, figure { break-inside: avoid; page-break-inside: avoid; }
      .code-copy { display: none; }
      pre {
        overflow: visible;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .footer { margin-top: 4mm; padding-top: 2mm; }
      h1, h2, h3 { break-after: avoid; page-break-after: avoid; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到正文</a>
  <div class="layout">
    <aside class="rail" aria-label="文档导航">
      <div class="nav-shell">
        <button class="nav-trigger" type="button" aria-expanded="false" aria-controls="document-navigation" aria-label="打开文档目录">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="square" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
        <div class="nav-panel" id="document-navigation">
          <div class="nav-overview">
            <p class="kicker">{{KICKER}}</p>
            <h1 class="rail-title">{{DOCUMENT_TITLE}}</h1>
            <p class="rail-subtitle">{{DOCUMENT_SUBTITLE}}</p>
            <div class="meta">{{META_HTML}}</div>
          </div>
          <nav class="toc" aria-label="文档目录">{{TOC_HTML}}</nav>
        </div>
      </div>
    </aside>

    <main class="document" id="main-content" tabindex="-1">
      <header class="hero">
        <p class="hero-kicker">{{KICKER}}</p>
        <h1>{{DOCUMENT_TITLE}}</h1>
        <p class="hero-subtitle">{{DOCUMENT_SUBTITLE}}</p>
      </header>
      {{LEAD_HTML}}
      {{CONTENT_HTML}}
      <footer class="footer">{{FOOTER_HTML}}</footer>
    </main>
  </div>
  <script>
    (() => {
      if (document.documentElement.dataset.outputProfile !== "document") return;
      const shell = document.querySelector(".nav-shell");
      const trigger = document.querySelector(".nav-trigger");
      const panel = document.querySelector(".nav-panel");
      if (!shell || !trigger || !panel) return;

      let pinned = false;
      const setOpen = (open) => {
        shell.classList.toggle("is-open", open);
        trigger.setAttribute("aria-expanded", String(open));
        trigger.setAttribute("aria-label", open ? "关闭文档目录" : "打开文档目录");
      };

      trigger.addEventListener("click", () => {
        pinned = !pinned;
        shell.classList.remove("is-hover-suppressed");
        setOpen(pinned);
      });
      shell.addEventListener("pointerenter", (event) => {
        if (event.pointerType === "mouse" && !shell.classList.contains("is-hover-suppressed")) {
          setOpen(true);
        }
      });
      shell.addEventListener("pointerleave", () => {
        shell.classList.remove("is-hover-suppressed");
        if (!pinned) setOpen(false);
      });
      panel.querySelectorAll('a[href^="#"]').forEach((link) => {
        link.addEventListener("click", () => {
          pinned = false;
          setOpen(false);
        });
      });
      document.addEventListener("pointerdown", (event) => {
        if (!shell.contains(event.target)) {
          pinned = false;
          setOpen(false);
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && shell.classList.contains("is-open")) {
          pinned = false;
          shell.classList.add("is-hover-suppressed");
          setOpen(false);
          trigger.focus({ preventScroll: true });
        }
      });

      const copyText = async (value) => {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(value);
          return;
        }
        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.append(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        textarea.remove();
        if (!copied) throw new Error("copy failed");
      };
      document.querySelectorAll(".code-copy").forEach((button) => {
        button.addEventListener("click", async () => {
          const code = button.closest(".code-block")?.querySelector("code");
          if (!code) return;
          const original = button.textContent;
          try {
            await copyText(code.textContent || "");
            button.textContent = "已复制";
          } catch {
            button.textContent = "复制失败";
          }
          window.setTimeout(() => { button.textContent = original; }, 1600);
        });
      });
    })();
  </script>
</body>
</html>
